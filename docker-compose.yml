version: "3.9"

services:
  app-dev:
    build: .
    container_name: flask-app-dev-instance
    ports:
      - "5000:5000"
    volumes:
      - ./:/app  # auto-reload โค้ดทุกครั้ง
    environment:
      FLASK_APP: app.py
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    command: flask run --host=0.0.0.0 --port=5000